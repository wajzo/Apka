<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f766e">
<title>Evidencia hodín</title>
<style>
  :root {
    --bg: #f3f4f6; --surface: #ffffff; --surface-2: #f9fafb; --line: #e5e7eb; --line-strong: #d1d5db;
    --text: #111827; --muted: #6b7280;
    --primary: #0f766e; --primary-hover: #115e59; --primary-soft: #e6f4f2; --on-primary: #ffffff;
    --danger: #b91c1c; --danger-soft: #fef2f2;
    --rest: #b91c1c; --rest-bg: #fef2f2;
    --pay: #b45309;  --pay-bg: #fffbeb;
    --info: #6b7280; --info-bg: #f3f4f6;
    --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0f14; --surface: #141a21; --surface-2: #1a222b; --line: #26303b; --line-strong: #364252;
      --text: #e5e7eb; --muted: #9ca3af;
      --primary: #2dd4bf; --primary-hover: #5eead4; --primary-soft: #11302c; --on-primary: #06201c;
      --danger: #f87171; --danger-soft: #2a1517;
      --rest: #f87171; --rest-bg: #2a1517;
      --pay: #fbbf24;  --pay-bg: #2a2111;
      --info: #9ca3af; --info-bg: #1a222b;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4);
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  [hidden] { display: none !important; }
  h2 { margin: 0 0 4px; font-size: 22px; letter-spacing: -.01em; }
  h3 { margin: 0 0 8px; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }

  /* hlavička */
  .appbar { position: sticky; top: 0; z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
  .appbar-in { max-width: 1100px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 650; font-size: 16px; letter-spacing: -.01em; }
  .logo { width: 32px; height: 32px; border-radius: 9px; background: var(--primary); color: var(--on-primary); display: grid; place-items: center; flex: none; }
  .spacer { flex: 1; }
  .user { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
  .avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--primary-soft); color: var(--primary); font-weight: 650; display: grid; place-items: center; font-size: 13px; }
  @media (max-width: 480px) { #who { display: none; } }

  .wrap { max-width: 1100px; margin: 0 auto; padding: 16px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 20px; }
  .layout { display: grid; gap: 16px; grid-template-columns: 1fr; align-items: start; }
  @media (min-width: 860px) { .layout { grid-template-columns: minmax(300px, 380px) 1fr; } }

  /* prihlásenie */
  #login { width: min(400px, 100%); margin: 7vh auto 0; }
  .login-brand { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-bottom: 18px; text-align: center; }
  .login-brand .logo { width: 44px; height: 44px; border-radius: 12px; }
  .login-brand p { margin: 0; color: var(--muted); font-size: 14px; }

  /* formuláre a tlačidlá */
  label { display: block; font-size: 13px; font-weight: 500; margin: 14px 0 6px; color: var(--muted); }
  select, input { width: 100%; padding: 10px 12px; min-height: 44px; font: inherit; color: var(--text); background: var(--surface);
                  border: 1px solid var(--line-strong); border-radius: 10px; }
  select:focus, input:focus, button:focus-visible, a:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; border-color: var(--primary); }
  button { font: inherit; font-weight: 600; border: 0; border-radius: 10px; cursor: pointer; min-height: 40px; padding: 8px 14px;
           background: var(--primary); color: var(--on-primary); transition: background .15s; }
  button:hover { background: var(--primary-hover); }
  button:disabled { opacity: .5; cursor: default; }
  .big { width: 100%; min-height: 48px; font-size: 16px; margin-top: 14px; }
  button.running { background: var(--danger); color: #fff; }
  button.ghost { background: transparent; color: var(--text); border: 1px solid var(--line-strong); font-weight: 500; }
  button.ghost:hover { background: var(--surface-2); }
  button.danger { background: transparent; color: var(--danger); border: 1px solid var(--line-strong); font-weight: 500; min-height: 34px; padding: 4px 10px; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
  button.danger:hover { background: var(--danger-soft); border-color: var(--danger); }
  a { color: var(--primary); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .err { color: var(--danger); font-size: 14px; margin-top: 10px; min-height: 20px; }

  /* prepínač režimu */
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; margin-top: 14px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; }
  .seg button { background: transparent; color: var(--muted); font-weight: 500; min-height: 36px; }
  .seg button:hover { background: transparent; color: var(--text); }
  .seg button.on { background: var(--surface); color: var(--text); font-weight: 600; box-shadow: var(--shadow); }

  /* stopky */
  .watch { margin-top: 14px; padding: 18px 12px 6px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface-2); }
  #display { font-size: 46px; font-weight: 300; text-align: center; letter-spacing: .02em; font-variant-numeric: tabular-nums; }
  .pill { display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 22px; font-size: 13px; color: var(--muted); }
  .pill .live { width: 8px; height: 8px; border-radius: 50%; background: var(--danger); animation: pulse 1.4s infinite; }
  @keyframes pulse { 50% { opacity: .25; } }
  .watch .big { margin: 8px 0 12px; }
  #status { margin-top: 12px; font-size: 14px; min-height: 20px; text-align: center; }

  .due { display: flex; gap: 8px; align-items: center; background: var(--pay-bg); color: var(--pay); border: 1px solid var(--pay);
         border-radius: 10px; padding: 9px 12px; margin-bottom: 8px; font-size: 14px; }

  /* pravý panel */
  .monthbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .monthbar button { width: 38px; min-height: 38px; padding: 0; font-size: 20px; line-height: 1; }
  #monthLabel { font-size: 18px; font-weight: 650; letter-spacing: -.01em; }
  .block { margin-bottom: 20px; }
  .list { margin: 0; padding: 0; list-style: none; }
  .list li { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .list li:last-child { border-bottom: 0; }
  .list .grow { flex: 1; min-width: 0; }
  .list .val { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
  .list .total { font-weight: 650; }
  .list .sub { color: var(--muted); font-size: 12px; font-weight: 400; display: block; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; display: inline-block; }
  .sq { width: 10px; height: 10px; border-radius: 3px; flex: none; display: inline-block; }
  .t-rest { background: var(--rest); } .t-pay { background: var(--pay); } .t-info { background: var(--line-strong); }
  .badge { display: inline-block; font-size: 11px; font-weight: 650; padding: 2px 7px; border-radius: 999px; background: var(--pay-bg); color: var(--pay); border: 1px solid var(--pay); white-space: nowrap; }
  .callout { margin: 0 0 10px; padding: 10px 12px; border-radius: 10px; font-size: 13px; background: var(--pay-bg); color: var(--pay); border: 1px solid var(--pay); }
  .muted { color: var(--muted); font-size: 14px; }

  .cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
  .cal .wd { text-align: center; font-size: 11px; font-weight: 600; letter-spacing: .04em; color: var(--muted); padding: 4px 0; text-transform: uppercase; }
  .cal .day { min-height: 74px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--text);
              padding: 5px; text-align: left; font-weight: 400; font-size: 12px; display: flex; flex-direction: column; gap: 2px; width: 100%; position: relative; overflow: hidden; }
  .cal .day:hover { background: var(--surface-2); border-color: var(--line-strong); }
  .cal .day.empty { border: 0; background: transparent; cursor: default; min-height: 0; }
  .cal .day.hol-rest { background: var(--rest-bg); }
  .cal .day.hol-pay  { background: var(--pay-bg); }
  .cal .day.hol-info { background: var(--info-bg); }
  .cal .day.sel { border-color: var(--primary); box-shadow: inset 0 0 0 1px var(--primary); }
  .num { font-size: 12px; font-weight: 600; width: 22px; height: 22px; display: grid; place-items: center; border-radius: 50%; }
  .today .num { background: var(--primary); color: var(--on-primary); }
  .holname { font-size: 10px; line-height: 1.2; font-weight: 500; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .hol-rest .holname { color: var(--rest); } .hol-pay .holname { color: var(--pay); } .hol-info .holname { color: var(--info); }
  .chip { display: flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 500; line-height: 1.2; white-space: nowrap; overflow: hidden; }
  .chip .dot { width: 7px; height: 7px; }
  .eur { position: absolute; top: 4px; right: 4px; font-size: 10px; font-weight: 700; padding: 1px 5px; border-radius: 999px; background: var(--pay); color: var(--surface); }
  @media (max-width: 560px) { .cal .day { min-height: 58px; padding: 3px; } .holname { display: none; } .chip { font-size: 10px; } }

  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; font-size: 12px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }

  #detail { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--line); }
  .holtag { display: inline-block; margin-bottom: 10px; font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 8px; }
  .holtag.rest { background: var(--rest-bg); color: var(--rest); } .holtag.pay { background: var(--pay-bg); color: var(--pay); } .holtag.info { background: var(--info-bg); color: var(--info); }
  .entry { display: flex; gap: 12px; align-items: flex-start; padding: 12px; margin-bottom: 8px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); }
  .entry .grow { flex: 1; min-width: 0; }
  .entry .meta { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .entry .dot { margin-top: 6px; }
</style>
</head>
<body>

<header class="appbar" id="appbar" hidden>
  <div class="appbar-in">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2"/><path d="M9.5 2h5"/></svg>
      </span>
      Evidencia hodín
    </div>
    <span class="spacer"></span>
    <div class="user"><span class="avatar" id="avatar"></span><span id="who"></span></div>
    <button id="logoutBtn" class="ghost">Odhlásiť</button>
  </div>
</header>

<div class="wrap">

  <!-- Prihlásenie / vytvorenie účtu (RLS politiky v Supabase vyžadujú prihláseného používateľa) -->
  <section id="login" class="card">
    <div class="login-brand">
      <span class="logo" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2"/><path d="M9.5 2h5"/></svg>
      </span>
      <div>
        <h2 id="loginTitle">Prihlásenie</h2>
        <p>Evidencia hodín a návštev</p>
      </div>
    </div>
    <label for="username" style="margin-top:0">Meno</label>
    <input id="username" type="text" autocomplete="username">
    <label for="password">PIN (4 číslice)</label>
    <input id="password" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="current-password">
    <div id="pin2Wrap" hidden>
      <label for="password2">Zopakuj PIN</label>
      <input id="password2" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="new-password">
    </div>
    <button id="loginBtn" class="big">Prihlásiť</button>
    <div id="loginError" class="err"></div>
    <p style="text-align:center;font-size:14px;margin:6px 0 0">
      <a href="#" id="modeLink">Nemáš účet? Vytvoriť účet</a>
    </p>
  </section>

  <!-- Aplikácia -->
  <div id="app" class="layout" hidden>

    <!-- Ľavý panel: zápis práce -->
    <section class="card">
      <div id="due"></div>

      <h3>Nový záznam</h3>
      <label for="workplace" style="margin-top:0">Pracovisko</label>
      <select id="workplace"></select>

      <label for="note">Poznámka (voliteľné)</label>
      <input id="note" type="text">

      <!-- Pracovisko s meraním času: stopky alebo ručné zadanie od–do -->
      <div id="modeSwitch" class="seg" hidden>
        <button id="modeStopwatch" class="on" type="button">Stopky</button>
        <button id="modeManual" type="button">Zadať čas</button>
      </div>

      <div id="stopwatchBox" class="watch">
        <div id="display">00:00:00</div>
        <div class="pill" id="runPill"></div>
        <button id="toggleBtn" class="big">Štart</button>
      </div>

      <div id="manualBox" hidden>
        <label for="mDate">Dátum</label>
        <input id="mDate" type="date">
        <div class="row2">
          <div><label for="mFrom">Od</label><input id="mFrom" type="time"></div>
          <div><label for="mTo">Do</label><input id="mTo" type="time"></div>
        </div>
        <label for="mBreak">Pauza (minúty, voliteľné)</label>
        <input id="mBreak" type="number" inputmode="numeric" min="0" max="600" placeholder="0">
        <button id="manualSave" class="big">Uložiť čas</button>
      </div>

      <button id="visitBtn" class="big" hidden>Odškrtnúť návštevu</button>
      <div id="status"></div>
    </section>

    <!-- Pravý panel: prehľad mesiaca a kalendár -->
    <aside class="card">
      <div class="monthbar">
        <button id="prevMonth" class="ghost" aria-label="Predošlý mesiac">‹</button>
        <span id="monthLabel"></span>
        <button id="nextMonth" class="ghost" aria-label="Nasledujúci mesiac">›</button>
      </div>

      <div class="block">
        <h3>Kde som bol</h3>
        <ul id="summary" class="list"></ul>
      </div>

      <div class="block">
        <h3>Sviatky v mesiaci</h3>
        <div id="holCallout"></div>
        <ul id="holList" class="list"></ul>
      </div>

      <div class="block" style="margin-bottom:0">
        <h3>Kalendár</h3>
        <div id="calendar" class="cal"></div>
        <div class="legend">
          <span><i class="sq t-rest"></i>Deň pracovného pokoja</span>
          <span><i class="sq t-pay"></i>Pracovný deň s príplatkom</span>
          <span><i class="sq t-info"></i>Sviatok bez príplatku</span>
          <span><b class="badge">€</b>Odpracované vo sviatok</span>
        </div>
      </div>

      <div id="detail"></div>
    </aside>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // 1) Údaje zo Supabase (Project Settings → API). Publishable kľúč smie byť verejný.
  const SUPABASE_URL = 'https://tcwdekbucdlbyskywdpk.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_E8jT3tcOcKua-VabB5nVhg_ODszSdp8';
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const $ = id => document.getElementById(id);
  let user = null;
  let tickId = null;
  let workplaces = [];
  let manualMode = false;

  // ---------- pomocné funkcie ----------
  const pad = n => String(n).padStart(2, '0');
  const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const fmtH = h => Number(h).toLocaleString('sk-SK', { maximumFractionDigits: 2 });
  const fmtTime = iso => new Date(iso).toLocaleTimeString('sk-SK', { hour: '2-digit', minute: '2-digit' });
  const fmtShort = key => { const [, m, d] = key.split('-'); return `${+d}. ${+m}.`; };
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  function formatElapsed(ms) {
    const s = Math.floor(ms / 1000);
    return `${pad(Math.floor(s / 3600))}:${pad(Math.floor(s / 60) % 60)}:${pad(s % 60)}`;
  }
  const setStatus = (text, error = false) => {
    $('status').textContent = text;
    $('status').style.color = error ? 'var(--danger)' : 'var(--primary)';
  };

  // Bežiace stopky sa držia v localStorage (pre každého používateľa zvlášť), takže prežijú obnovenie stránky
  const storageKey = () => 'stopky_bezi_' + (user ? user.id : '');
  const getRunning = () => { try { return JSON.parse(localStorage.getItem(storageKey())); } catch { return null; } };

  const PALETTE = ['#0f766e', '#2563eb', '#ea580c', '#7c3aed', '#0891b2', '#be185d'];
  const colorOf = id => {
    const i = workplaces.findIndex(w => w.id === id);
    return i < 0 ? '#9ca3af' : PALETTE[i % PALETTE.length];
  };
  const nameOf = id => (workplaces.find(w => w.id === id) || {}).name || 'Iné pracovisko';

  // ---------- sviatky (Slovensko) ----------
  // Typy: rest = deň pracovného pokoja, pay = pracovný deň, ale za prácu patrí príplatok,
  //       info = štátny sviatok bez príplatku.
  // Pozor: 8. máj a 15. september sú dňom pracovného pokoja len v iných rokoch než 2026 (zákon 261/2025, platí len pre rok 2026);
  // 17. november a 1. september už dňami pracovného pokoja nie sú. Pre ďalšie roky over aktuálne znenie zákona 241/1993.
  function easter(y) { // veľkonočná nedeľa (gregoriánsky kalendár)
    const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4,
          f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30,
          i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7,
          m = Math.floor((a + 11 * h + 22 * l) / 451), month = Math.floor((h + l - 7 * m + 114) / 31),
          day = ((h + l - 7 * m + 114) % 31) + 1;
    return new Date(y, month - 1, day);
  }
  const holCache = {};
  function holidaysFor(y) {
    if (holCache[y]) return holCache[y];
    const m = {};
    const add = (mm, dd, name, type) => { m[`${y}-${pad(mm)}-${pad(dd)}`] = { name, type }; };
    const e = easter(y);
    const gf = new Date(e); gf.setDate(e.getDate() - 2);
    const em = new Date(e); em.setDate(e.getDate() + 1);
    add(1, 1, 'Deň vzniku SR', 'rest');
    add(1, 6, 'Traja králi', 'rest');
    m[ymd(gf)] = { name: 'Veľký piatok', type: 'rest' };
    m[ymd(em)] = { name: 'Veľkonočný pondelok', type: 'rest' };
    add(5, 1, 'Sviatok práce', 'rest');
    add(5, 8, 'Deň víťazstva nad fašizmom', y === 2026 ? 'pay' : 'rest');
    add(7, 5, 'Sv. Cyril a Metod', 'rest');
    add(8, 29, 'Výročie SNP', 'rest');
    add(9, 1, 'Deň Ústavy SR', 'info');
    add(9, 15, 'Sedembolestná Panna Mária', y === 2026 ? 'pay' : 'rest');
    add(10, 28, 'Vznik česko-slovenského štátu', 'info');
    add(11, 1, 'Všetkých svätých', 'rest');
    add(11, 17, 'Deň boja za slobodu a demokraciu', 'info');
    add(12, 24, 'Štedrý deň', 'rest');
    add(12, 25, '1. sviatok vianočný', 'rest');
    add(12, 26, '2. sviatok vianočný', 'rest');
    return (holCache[y] = m);
  }
  const holidayOn = key => holidaysFor(+key.slice(0, 4))[key];
  const HOL_LABEL = {
    rest: 'Deň pracovného pokoja',
    pay: 'Pracovný deň s nárokom na príplatok',
    info: 'Sviatok bez nároku na príplatok'
  };
  const PAYS = t => t === 'rest' || t === 'pay';
  const SURCHARGE_NOTE = 'Za prácu vo sviatok patrí zamestnancovi podľa Zákonníka práce príplatok najmenej 100 % priemerného zárobku (alebo náhradné voľno). Over si podmienky vo svojej zmluve.';

  // ---------- stopky ----------
  function renderRunning() {
    const run = getRunning();
    clearInterval(tickId);
    if (run) {
      $('toggleBtn').textContent = 'Stop';
      $('toggleBtn').classList.add('running');
      $('workplace').value = run.workplaceId;
      $('workplace').disabled = true;
      $('runPill').innerHTML = '<span class="live"></span>Beží';
      const update = () => { $('display').textContent = formatElapsed(Date.now() - new Date(run.startedAt)); };
      update();
      tickId = setInterval(update, 500);
    } else {
      $('toggleBtn').textContent = 'Štart';
      $('toggleBtn').classList.remove('running');
      $('workplace').disabled = false;
      $('runPill').textContent = 'Pripravené';
      $('display').textContent = '00:00:00';
    }
    applyMode();
  }

  async function loadWorkplaces() {
    const { data, error } = await db.from('workplaces')
      .select('id, name, tracks_time, visit_every_days').eq('active', true).order('name');
    if (error) return setStatus('Nepodarilo sa načítať pracoviská: ' + error.message, true);
    workplaces = data;
    $('workplace').innerHTML = data.map(w => `<option value="${esc(w.id)}">${esc(w.name)}</option>`).join('');
  }

  async function toggle() {
    const run = getRunning();

    if (!run) {
      // ŠTART
      if (!$('workplace').value) return setStatus('Vyber pracovisko.', true);
      localStorage.setItem(storageKey(), JSON.stringify({
        startedAt: new Date().toISOString(),
        workplaceId: $('workplace').value
      }));
      setStatus('');
      renderRunning();
      return;
    }

    // STOP
    const start = new Date(run.startedAt);
    const end = new Date();
    const hours = Math.round(((end - start) / 36e5) * 100) / 100;

    $('toggleBtn').disabled = true;
    const { error } = await db.from('time_entries').insert({
      user_id: user.id,
      workplace_id: run.workplaceId,
      work_date: ymd(start), // dátum začiatku v lokálnom čase
      start_time: start.toISOString(),
      end_time: end.toISOString(),
      hours,
      note: $('note').value || null
    });
    $('toggleBtn').disabled = false;

    if (error) {
      // Stopky ostávajú v localStorage, nič sa nestratí – stačí kliknúť na Stop znova
      return setStatus('Uloženie zlyhalo: ' + error.message, true);
    }
    localStorage.removeItem(storageKey());
    $('note').value = '';
    renderRunning();
    setStatus(`Uložené: ${fmtH(hours)} h`);
    loadMonth();
  }

  // ---------- ručné zadanie času od–do ----------
  async function saveManual() {
    const wid = $('workplace').value;
    const date = $('mDate').value, from = $('mFrom').value, to = $('mTo').value;
    const brk = Math.max(0, parseInt($('mBreak').value, 10) || 0);
    if (!wid) return setStatus('Vyber pracovisko.', true);
    if (!date || !from || !to) return setStatus('Vyplň dátum, čas od a čas do.', true);
    const start = new Date(`${date}T${from}`);
    const end = new Date(`${date}T${to}`);
    if (!(end > start)) return setStatus('Čas „do" musí byť neskôr ako „od".', true);
    const hours = Math.round(((end - start) / 36e5 - brk / 60) * 100) / 100;
    if (hours <= 0) return setStatus('Pauza je dlhšia ako odpracovaný čas.', true);

    $('manualSave').disabled = true;
    const { error } = await db.from('time_entries').insert({
      user_id: user.id,
      workplace_id: wid,
      work_date: date,
      start_time: start.toISOString(),
      end_time: end.toISOString(),
      break_minutes: brk,
      hours,
      note: $('note').value || null
    });
    $('manualSave').disabled = false;
    if (error) return setStatus('Uloženie zlyhalo: ' + error.message, true);
    $('note').value = '';
    $('mBreak').value = '';
    setStatus(`Uložené: ${fmtH(hours)} h (${from}–${to})`);
    // kalendár preskočí na mesiac uloženého záznamu
    const d = new Date(`${date}T00:00:00`);
    viewYear = d.getFullYear(); viewMonth = d.getMonth(); selectedDate = date;
    loadMonth();
  }

  // ---------- režim podľa pracoviska ----------
  const current = () => workplaces.find(w => w.id === $('workplace').value);

  function applyMode() {
    const w = current();
    const timed = !w || w.tracks_time;
    const running = !!getRunning();
    const showManual = timed && manualMode && !running;
    $('modeSwitch').hidden = !(timed && !running);
    $('stopwatchBox').hidden = !timed || showManual;
    $('manualBox').hidden = !showManual;
    $('visitBtn').hidden = timed;
    $('modeStopwatch').classList.toggle('on', !manualMode);
    $('modeManual').classList.toggle('on', manualMode);
  }

  function setManual(on) {
    manualMode = on;
    if (on && !$('mDate').value) $('mDate').value = ymd(new Date());
    setStatus('');
    applyMode();
  }

  async function visit() {
    const w = current();
    if (!w) return;
    $('visitBtn').disabled = true;
    const { error } = await db.from('time_entries').insert({
      user_id: user.id,
      workplace_id: w.id,
      work_date: ymd(new Date()),
      note: $('note').value || null
    });
    $('visitBtn').disabled = false;
    if (error) return setStatus('Uloženie zlyhalo: ' + error.message, true);
    $('note').value = '';
    setStatus(`Návšteva zapísaná: ${w.name}`);
    showDueVisits();
    const now = new Date();
    viewYear = now.getFullYear(); viewMonth = now.getMonth(); selectedDate = ymd(now);
    loadMonth();
  }

  // Pripomienka pravidelných návštev: ak od poslednej návštevy uplynulo aspoň visit_every_days, zobrazí sa upozornenie
  async function showDueVisits() {
    const weekly = workplaces.filter(w => w.visit_every_days);
    if (!weekly.length) { $('due').innerHTML = ''; return; }
    const { data } = await db.from('time_entries')
      .select('workplace_id, work_date')
      .eq('user_id', user.id)
      .in('workplace_id', weekly.map(w => w.id))
      .order('work_date', { ascending: false });
    const last = {};
    (data || []).forEach(e => { if (!last[e.workplace_id]) last[e.workplace_id] = e.work_date; });
    const today = new Date(); today.setHours(0, 0, 0, 0);
    $('due').innerHTML = weekly.map(w => {
      const l = last[w.id];
      const days = l ? Math.floor((today - new Date(l + 'T00:00:00')) / 864e5) : null;
      if (days !== null && days < w.visit_every_days) return '';
      const when = days === null ? 'zatiaľ bez návštevy' : `naposledy pred ${days} d`;
      return `<div class="due"><strong>${esc(w.name)}</strong> · ${when} – treba ísť</div>`;
    }).join('');
  }

  // ---------- prehľad mesiaca a kalendár ----------
  const now0 = new Date();
  let viewYear = now0.getFullYear();
  let viewMonth = now0.getMonth();
  let selectedDate = ymd(now0);
  let entries = [];

  async function loadMonth() {
    const first = `${viewYear}-${pad(viewMonth + 1)}-01`;
    const nx = new Date(viewYear, viewMonth + 1, 1);
    const { data, error } = await db.from('time_entries')
      .select('id, workplace_id, work_date, start_time, end_time, hours, note')
      .eq('user_id', user.id)               // owner by inak videl aj cudzie záznamy
      .gte('work_date', first)
      .lt('work_date', ymd(nx))
      .order('work_date').order('start_time', { nullsFirst: true });
    if (error) { setStatus('Nepodarilo sa načítať prehľad: ' + error.message, true); return; }
    entries = data || [];
    renderMonth();
  }

  function renderMonth() {
    const label = new Date(viewYear, viewMonth, 1).toLocaleDateString('sk-SK', { month: 'long', year: 'numeric' });
    $('monthLabel').textContent = label.charAt(0).toUpperCase() + label.slice(1);
    const prefix = `${viewYear}-${pad(viewMonth + 1)}-`;

    // súhrn podľa pracoviska: počet dní a hodiny
    const by = {};
    entries.forEach(e => {
      const g = by[e.workplace_id] || (by[e.workplace_id] = { days: new Set(), hours: 0 });
      g.days.add(e.work_date);
      g.hours += Number(e.hours || 0);
    });
    const ids = Object.keys(by).sort((a, b) => by[b].days.size - by[a].days.size);
    let total = 0;
    $('summary').innerHTML = ids.length ? ids.map(id => {
      total += by[id].hours;
      const hours = by[id].hours > 0 ? ` · ${fmtH(by[id].hours)} h` : '';
      return `<li><span class="dot" style="background:${colorOf(id)}"></span><span class="grow">${esc(nameOf(id))}</span><span class="val">${by[id].days.size}×${hours}</span></li>`;
    }).join('') + (total > 0 ? `<li class="total"><span class="grow">Odpracované spolu</span><span class="val">${fmtH(total)} h</span></li>` : '')
      : '<li class="muted">V tomto mesiaci zatiaľ nič.</li>';

    // sviatky v mesiaci a práca vo sviatok (nárok na príplatok)
    const workedDates = new Set(entries.map(e => e.work_date));
    const hols = Object.entries(holidaysFor(viewYear)).filter(([k]) => k.startsWith(prefix)).sort();
    const workedOnPaying = hols.filter(([k, h]) => PAYS(h.type) && workedDates.has(k));
    $('holCallout').innerHTML = workedOnPaying.length
      ? `<div class="callout"><strong>Vo sviatok si pracoval: ${workedOnPaying.map(([k]) => fmtShort(k)).join(', ')}.</strong> ${SURCHARGE_NOTE}</div>` : '';
    $('holList').innerHTML = hols.length ? hols.map(([k, h]) => {
      const worked = PAYS(h.type) && workedDates.has(k);
      return `<li><i class="sq t-${h.type}"></i><span class="grow">${esc(h.name)}<span class="sub">${HOL_LABEL[h.type]}</span></span>
        ${worked ? '<span class="badge">€ odpracované</span>' : ''}<span class="val">${fmtShort(k)}</span></li>`;
    }).join('') : '<li class="muted">V tomto mesiaci nie je žiadny sviatok.</li>';

    // mriežka kalendára (týždeň začína pondelkom)
    const byDay = {};
    entries.forEach(e => (byDay[e.work_date] = byDay[e.work_date] || []).push(e));
    const offset = (new Date(viewYear, viewMonth, 1).getDay() + 6) % 7;
    const daysIn = new Date(viewYear, viewMonth + 1, 0).getDate();
    const today = ymd(new Date());
    let html = ['Po', 'Ut', 'St', 'Št', 'Pi', 'So', 'Ne'].map(d => `<div class="wd">${d}</div>`).join('');
    for (let i = 0; i < offset; i++) html += '<div class="day empty"></div>';
    for (let d = 1; d <= daysIn; d++) {
      const key = `${prefix}${pad(d)}`;
      const list = byDay[key] || [];
      const hol = holidayOn(key);
      const chips = list.slice(0, 3).map(e =>
        `<span class="chip"><span class="dot" style="background:${colorOf(e.workplace_id)}"></span>${e.hours != null ? fmtH(e.hours) + ' h' : '✓'}</span>`).join('')
        + (list.length > 3 ? `<span class="chip">+${list.length - 3}</span>` : '');
      const cls = 'day' + (hol ? ' hol-' + hol.type : '') + (key === today ? ' today' : '') + (key === selectedDate ? ' sel' : '');
      const title = hol ? ` title="${esc(hol.name)} – ${esc(HOL_LABEL[hol.type])}"` : '';
      const eur = hol && PAYS(hol.type) && list.length ? '<span class="eur">€</span>' : '';
      html += `<button type="button" class="${cls}" data-date="${key}"${title}><span class="num">${d}</span>${hol ? `<span class="holname">${esc(hol.name)}</span>` : ''}${chips}${eur}</button>`;
    }
    $('calendar').innerHTML = html;
    renderDetail();
  }

  function renderDetail() {
    const list = entries.filter(e => e.work_date === selectedDate);
    const title = new Date(selectedDate + 'T00:00:00').toLocaleDateString('sk-SK', { weekday: 'long', day: 'numeric', month: 'long' });
    const hol = holidayOn(selectedDate);
    let html = `<h3>${esc(title)}</h3>`;
    if (hol) html += `<div class="holtag ${hol.type}">${esc(hol.name)} · ${esc(HOL_LABEL[hol.type])}</div>`;
    if (hol && PAYS(hol.type) && list.length) html += `<div class="callout">${SURCHARGE_NOTE}</div>`;
    html += list.length ? list.map(e => {
      const when = e.start_time && e.end_time ? `${fmtTime(e.start_time)}–${fmtTime(e.end_time)} · ${fmtH(e.hours)} h` : 'návšteva';
      const note = e.note ? `<div class="meta">${esc(e.note)}</div>` : '';
      return `<div class="entry"><span class="dot" style="background:${colorOf(e.workplace_id)}"></span>
        <div class="grow"><strong>${esc(nameOf(e.workplace_id))}</strong><div class="meta">${when}</div>${note}</div>
        <button type="button" class="danger" data-del="${esc(e.id)}" aria-label="Odstrániť záznam">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6l1 14h10l1-14"/></svg>Odstrániť</button></div>`;
    }).join('') : '<div class="muted">V tento deň nič nie je zapísané.</div>';
    $('detail').innerHTML = html;
  }

  function shiftMonth(delta) {
    const d = new Date(viewYear, viewMonth + delta, 1);
    viewYear = d.getFullYear(); viewMonth = d.getMonth();
    selectedDate = ymd(new Date()).startsWith(`${viewYear}-${pad(viewMonth + 1)}`) ? ymd(new Date()) : `${viewYear}-${pad(viewMonth + 1)}-01`;
    loadMonth();
  }

  async function deleteEntry(id) {
    if (!confirm('Odstrániť tento záznam? Akciu nie je možné vrátiť späť.')) return;
    const { error } = await db.from('time_entries').delete().eq('id', id).eq('user_id', user.id);
    if (error) return setStatus('Odstránenie zlyhalo: ' + error.message, true);
    setStatus('Záznam odstránený.');
    loadMonth();
    showDueVisits();
  }

  // ---------- prihlásenie a vytvorenie účtu ----------
  async function showApp() {
    $('login').hidden = true;
    $('app').hidden = false;
    $('appbar').hidden = false;
    const { data: prof } = await db.from('profiles').select('full_name').eq('id', user.id).maybeSingle();
    const name = prof ? prof.full_name : '';
    $('who').textContent = name;
    $('avatar').textContent = (name || '?').trim().charAt(0).toUpperCase();
    await loadWorkplaces();
    renderRunning();
    showDueVisits();
    loadMonth();
  }

  // Supabase Auth vyžaduje e-mail, preto z mena vytvoríme interný (nepoužíva sa na posielanie pošty).
  // "Ján Novák" -> "jan.novak@example.com"
  const toEmail = name =>
    name.trim().toLowerCase()
      .normalize('NFD').replace(/[̀-ͯ]/g, '')
      .replace(/[^a-z0-9]+/g, '.').replace(/^\.|\.$/g, '') + '@example.com';

  // Supabase vyžaduje heslo aspoň 6 znakov, preto sa k 4-miestnemu PIN-u pred odoslaním pripojí pevná predpona.
  // PIN 1234 -> heslo "Apka-1234".
  const toPassword = pin => 'Apka-' + pin;

  let registering = false;

  function setLoginMode(reg) {
    registering = reg;
    $('loginTitle').textContent = reg ? 'Vytvoriť účet' : 'Prihlásenie';
    $('loginBtn').textContent = reg ? 'Vytvoriť účet' : 'Prihlásiť';
    $('pin2Wrap').hidden = !reg;
    $('password').autocomplete = reg ? 'new-password' : 'current-password';
    $('modeLink').textContent = reg ? 'Už máš účet? Prihlásiť sa' : 'Nemáš účet? Vytvoriť účet';
    $('loginError').textContent = '';
  }

  async function login() {
    const name = $('username').value.trim();
    const pin = $('password').value.trim();
    const err = msg => { $('loginError').textContent = msg; };
    err('');
    if (!name) return err('Zadaj meno.');
    if (!toEmail(name).replace('@example.com', '')) return err('Meno musí obsahovať aspoň jedno písmeno alebo číslicu.');
    if (!/^\d{4}$/.test(pin)) return err('PIN musí mať presne 4 číslice.');
    if (registering && pin !== $('password2').value.trim()) return err('PIN-y sa nezhodujú.');

    $('loginBtn').disabled = true;
    let result;
    if (registering) {
      // Profil (člen) vytvorí v databáze trigger automaticky z full_name
      result = await db.auth.signUp({
        email: toEmail(name),
        password: toPassword(pin),
        options: { data: { full_name: name } }
      });
    } else {
      result = await db.auth.signInWithPassword({ email: toEmail(name), password: toPassword(pin) });
    }
    $('loginBtn').disabled = false;
    const { data, error } = result;

    if (error) {
      if (/already registered|already exists/i.test(error.message)) return err('Také meno už existuje. Skús sa prihlásiť alebo zvoľ iné meno.');
      if (error.message === 'Invalid login credentials') return err('Nesprávne meno alebo PIN.');
      return err(error.message);
    }
    if (!data.session) {
      return err('Účet bol vytvorený, ale prihlásenie zlyhalo. Správca musí v Supabase vypnúť "Confirm email".');
    }
    user = data.user;
    showApp();
  }

  // ---------- udalosti ----------
  $('loginBtn').addEventListener('click', login);
  $('modeLink').addEventListener('click', e => { e.preventDefault(); setLoginMode(!registering); });
  $('username').addEventListener('keydown', e => { if (e.key === 'Enter') $('password').focus(); });
  $('password').addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    if (registering) $('password2').focus(); else login();
  });
  $('password2').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });

  $('logoutBtn').addEventListener('click', async () => { await db.auth.signOut(); location.reload(); });
  $('workplace').addEventListener('change', applyMode);
  $('toggleBtn').addEventListener('click', toggle);
  $('visitBtn').addEventListener('click', visit);
  $('manualSave').addEventListener('click', saveManual);
  $('modeStopwatch').addEventListener('click', () => setManual(false));
  $('modeManual').addEventListener('click', () => setManual(true));
  $('prevMonth').addEventListener('click', () => shiftMonth(-1));
  $('nextMonth').addEventListener('click', () => shiftMonth(1));
  $('calendar').addEventListener('click', e => {
    const b = e.target.closest('[data-date]');
    if (!b) return;
    selectedDate = b.dataset.date;
    renderMonth();
  });
  $('detail').addEventListener('click', e => {
    const b = e.target.closest('[data-del]');
    if (b) deleteEntry(b.dataset.del);
  });

  // Ak už existuje relácia, preskoč prihlásenie
  db.auth.getSession().then(({ data }) => {
    if (data.session) { user = data.session.user; showApp(); }
  });
</script>
</body>
</html>
